version: '3.8'

services:
  # --- MONGODB ---
  mongodb:
    image: mongo:latest
    container_name: hardware_set
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express_ui
    restart: always
    environment:
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
      ME_CONFIG_MONGODB_URL: "mongodb://admin:password123@mongodb:27017/?authSource=admin"
    ports:
      - "8081:8081"
    depends_on:
      - mongodb

  # --- REDIS ---
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --requirepass password123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_ui
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379:0:password123
    ports:
      - "8082:8081"
    depends_on:
      - redis

volumes:
  mongodb_data:
  redis_data: