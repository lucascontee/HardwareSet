name: HardwareSet CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 1. BACKEND (.NET 10 — Microsserviços + API Gateway)
  # ==========================================================
  dotnet-ci:
    name: .NET 10 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore HardwareSet.slnx

      - name: Build solution (Release)
        run: dotnet build HardwareSet.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test HardwareSet.slnx --configuration Release --no-build --verbosity normal

  # ==========================================================
  # 2. FRONT-END (React 19 + TypeScript + Vite)
  # ==========================================================
  frontend-ci:
    name: React Front-end Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HardwareSet.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: HardwareSet.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (Oxlint)
        run: npm run lint

      - name: Build production bundle (TypeScript + Vite)
        run: npm run build

  # ==========================================================
  # 3. INFRAESTRUTURA (Validação dos Dockerfiles e Compose)
  # ==========================================================
  docker-build-verify:
    name: Docker Compose & Multi-Stage Build Verify
    runs-on: ubuntu-latest
    needs:
      - dotnet-ci
      - frontend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yaml syntax
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Build all microservice and frontend container images
        run: docker compose -f docker-compose.yaml build
