name: HardwareSet CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 0. AGENTE REVISOR DE PR (Self-Hosted Runner)
  # ==========================================================
  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar Agente Revisor (Gemini)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python ai_reviewer.py

      - name: Postar resultado no Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review_output.txt

  # ==========================================================
  # 1. BACKEND (.NET 10 — Microsserviços + API Gateway)
  # ==========================================================
  dotnet-ci:
    name: .NET 10 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore HardwareSet.slnx

      - name: Build solution (Release)
        run: dotnet build HardwareSet.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test HardwareSet.slnx --configuration Release --no-build --verbosity normal

  # ==========================================================
  # 2. FRONT-END (React 19 + TypeScript + Vite)
  # ==========================================================
  frontend-ci:
    name: React Front-end Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HardwareSet.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: HardwareSet.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (Oxlint)
        run: npm run lint

      - name: Build production bundle (TypeScript + Vite)
        run: npm run build

  # ==========================================================
  # 3. VALIDAÇÃO DE CONTAINERS EM PULL REQUESTS (CI)
  # ==========================================================
  docker-build-verify:
    name: Docker Compose & Multi-Stage Build Verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - dotnet-ci
      - frontend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yaml syntax
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Build all microservice and frontend container images
        run: docker compose -f docker-compose.yaml build

  # ==========================================================
  # 4. PUBLICAÇÃO NO GITHUB CONTAINER REGISTRY - GHCR (Passo 7)
  # ==========================================================
  publish-ghcr:
    name: Publish ${{ matrix.service.name }} to GHCR
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - dotnet-ci
      - frontend-ci

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: hardwareset-gateway
            dockerfile: HardwareSet.Gateway/Dockerfile
          - name: hardwareset-catalog-api
            dockerfile: HardwareSet.Api/Dockerfile
          - name: hardwareset-builder-api
            dockerfile: HardwareSet.Builder.Api/Dockerfile
          - name: hardwareset-inventory-api
            dockerfile: HardwareSet.Inventory.Api/Dockerfile
          - name: hardwareset-order-api
            dockerfile: HardwareSet.Order.Api/Dockerfile
          - name: hardwareset-web
            dockerfile: HardwareSet.Web/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ==========================================================
  # 5. DEPLOY CONTÍNUO NO AZURE CONTAINER APPS (Passo 8 - CD)
  # ==========================================================
  deploy-azure:
    name: Deploy ${{ matrix.app }} to Azure Container Apps
    if: github.event_name != 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs:
      - publish-ghcr

    strategy:
      fail-fast: false
      matrix:
        app:
          - hardwareset-catalog-api
          - hardwareset-builder-api
          - hardwareset-inventory-api
          - hardwareset-order-api
          - hardwareset-gateway

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Azure Container App Revision
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ matrix.app }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP || 'rg-hardwareset' }} \
              --image ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}:latest
