name: HardwareSet CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

ai-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    permissions:
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar dependências
        run: pip install requests

      - name: Rodar Agente Revisor (Gemini)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python ai_reviewer.py

      - name: Postar resultado no Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review_output.txt

  dotnet-ci:
    name: .NET 10 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore HardwareSet.slnx

      - name: Build solution (Release)
        run: dotnet build HardwareSet.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test HardwareSet.slnx --configuration Release --no-build --verbosity normal

  frontend-ci:
    name: React Front-end Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HardwareSet.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: HardwareSet.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (Oxlint)
        run: npm run lint

      - name: Build production bundle (TypeScript + Vite)
        run: npm run build


  docker-build-verify:
    name: Docker Compose & Multi-Stage Build Verify
    runs-on: ubuntu-latest
    needs:
      - dotnet-ci
      - frontend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yaml syntax
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Build all microservice and frontend container images
        run: docker compose -f docker-compose.yaml build
